# ORCA — the local stack.
#
# Two containers, because a site runs two things the platform does not build: a
# database and an identity server. A site also runs a reverse proxy; it is not
# here because nothing in Phase 0 needs TLS terminated locally.
#
# There is deliberately NO message broker (ADR-007). Work is handed between
# services through the database. If you find yourself adding one here, read §B4
# first — it is a decision, not an omission.
#
#   cp .env.example .env && docker compose up -d
#
# Then run deploy/bootstrap once against the fresh database (see bootstrap/README.md).

name: orca

services:

  # ---------------------------------------------------------------------------
  # SQL Server — the only database. There is no PostgreSQL deployment (ADR-003).
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft publishes this image for linux/amd64 only. On an Apple-silicon
    # machine Docker Desktop runs it under emulation, which works and is slow.
    # Do NOT substitute azure-sql-edge to get a native arm64 image: it is a
    # different engine with a different feature set, and testing against it would
    # not be testing against what ships.
    platform: linux/amd64
    container_name: orca-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # 8+ characters with upper, lower, digit and symbol, or the container exits
      # on startup with a message that does not say so.
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - orca-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -No -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Keycloak — identity. Every service validates tokens by SIGNATURE, locally;
  # nothing calls out to Keycloak per request (§B6). That is also what lets a
  # site keep working when the wide-area link drops.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: orca-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
      - "${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image carries no curl and no wget. This is Keycloak's own documented
      # workaround: open the management port over bash's /dev/tcp and read the
      # readiness response back.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------
  # The two parties in §B9's sequence that ORCA does not build (WP7).
  #
  # A demo needs something at the other end of the connector call and something at
  # the other end of the barrier command. Both are WireMock with static mappings,
  # and both are deliberately dumb: a stub that reasoned about the request would
  # start encoding assumptions about the real component.
  #
  # The device-host mappings are DERIVED-FROM-1X: the gate, print and IO routes
  # extracted from the ORCA 1.x production caller, including the /api/io/ asymmetry
  # and the 200-AND-a-decodable-body success rule. Evidence about the fielded
  # estate, not a vendor specification — see deploy/stubs/README.md.
  # ---------------------------------------------------------------------------
  tos-stub:
    image: wiremock/wiremock:3.13.1
    container_name: orca-tos-stub
    command: ["--verbose", "--global-response-templating"]
    ports:
      - "${ORCA_TOS_STUB_PORT:-9200}:8080"
    volumes:
      - ./stubs/tos:/home/wiremock:ro

  device-host-stub:
    image: wiremock/wiremock:3.13.1
    container_name: orca-device-host-stub
    command: ["--verbose", "--global-response-templating"]
    ports:
      - "${ORCA_DEVICE_HOST_STUB_PORT:-9300}:8080"
    volumes:
      - ./stubs/device-host:/home/wiremock:ro

  # ---------------------------------------------------------------------------
  # One-shot tools (profile "tools") — the same scripts a Unix host can run
  # directly, executed inside a container so that a Windows machine needs
  # nothing but Docker. `docker compose run` enables the profile implicitly;
  # `docker compose up -d` never starts these.
  #
  #   docker compose run --rm bootstrap          # once, against a fresh database
  #   docker compose run --rm verify-isolation   # prove the 36 confinement checks
  #   docker compose run --rm demo-seed          # after core+runtime have migrated
  #   docker compose run --rm send-plate --plate T-DEMO-01
  #
  # The sqlcmd images reuse the SQL Server image already pulled for the stack.
  # ---------------------------------------------------------------------------
  bootstrap:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    profiles: ["tools"]
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/deploy/bootstrap/run.sh"]
    environment:
      ORCA_IN_CONTAINER: "1"
      ORCA_DB_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      ORCA_CORE_DB_PASSWORD: ${ORCA_CORE_DB_PASSWORD:?}
      ORCA_RUNTIME_DB_PASSWORD: ${ORCA_RUNTIME_DB_PASSWORD:?}
      ORCA_EDGE_DB_PASSWORD: ${ORCA_EDGE_DB_PASSWORD:?}
      ORCA_PORTAL_DB_PASSWORD: ${ORCA_PORTAL_DB_PASSWORD:?}
      ORCA_SYNC_DB_PASSWORD: ${ORCA_SYNC_DB_PASSWORD:?}
      ORCA_FLEET_DB_PASSWORD: ${ORCA_FLEET_DB_PASSWORD:?}
      ORCA_MEDIA_DB_PASSWORD: ${ORCA_MEDIA_DB_PASSWORD:?}
    volumes:
      - ./:/deploy:ro

  verify-isolation:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    profiles: ["tools"]
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/deploy/bootstrap/verify-isolation.sh"]
    environment:
      ORCA_IN_CONTAINER: "1"
      ORCA_DB_HOST: sqlserver
      ORCA_CORE_DB_PASSWORD: ${ORCA_CORE_DB_PASSWORD:?}
      ORCA_RUNTIME_DB_PASSWORD: ${ORCA_RUNTIME_DB_PASSWORD:?}
      ORCA_EDGE_DB_PASSWORD: ${ORCA_EDGE_DB_PASSWORD:?}
      ORCA_PORTAL_DB_PASSWORD: ${ORCA_PORTAL_DB_PASSWORD:?}
      ORCA_SYNC_DB_PASSWORD: ${ORCA_SYNC_DB_PASSWORD:?}
      ORCA_FLEET_DB_PASSWORD: ${ORCA_FLEET_DB_PASSWORD:?}
    volumes:
      - ./:/deploy:ro

  demo-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    profiles: ["tools"]
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/deploy/demo/seed.sh"]
    environment:
      ORCA_IN_CONTAINER: "1"
      ORCA_DB_HOST: sqlserver
      ORCA_CORE_DB_PASSWORD: ${ORCA_CORE_DB_PASSWORD:?}
      ORCA_RUNTIME_DB_PASSWORD: ${ORCA_RUNTIME_DB_PASSWORD:?}
      # The stub URLs written into the seed are read by services on the HOST,
      # so they stay host-form regardless of where the seed itself runs.
      ORCA_TOS_STUB_PORT: ${ORCA_TOS_STUB_PORT:-9200}
      ORCA_DEVICE_HOST_STUB_PORT: ${ORCA_DEVICE_HOST_STUB_PORT:-9300}
    volumes:
      - ./:/deploy:ro

  # Speaks the camera's framing at edge's listener, which runs on the HOST —
  # hence host.docker.internal (mapped to the host gateway for Linux parity).
  # Override anything, including --host and --port, by appending arguments.
  send-plate:
    image: python:3.12-alpine
    profiles: ["tools"]
    entrypoint: ["python", "/deploy/demo/send-plate.py", "--host", "host.docker.internal"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/deploy:ro

volumes:
  orca-sqlserver-data:
    name: orca-sqlserver-data
