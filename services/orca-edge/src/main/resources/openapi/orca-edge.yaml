openapi: 3.0.3

# =============================================================================
# orca-edge — the authored contract, and the source of truth for its API layer.
#
# The Java API layer is GENERATED from this file (ADR-014). The generator emits
# an interface and its DTOs; the controller is hand-written and implements that
# interface — so changing this document breaks the build until the implementation
# matches. That is what makes contract-first a compile-time constraint rather
# than documentation.
#
# Generated sources are never committed. In version control they drift from the
# spec and nobody notices.
#
# A route is authored here when the behaviour behind it exists, and not before —
# publishing a surface nothing implements is how a contract stops being true.
# WP7 adds §C3's /internal/commands/v1 and its read-back.
# =============================================================================

info:
  title: orca-edge
  description: |
    The hardware boundary (§C3) — every hardware contract, the durable capture buffer, the command log, device state.
  version: 0.0.1

servers:
  - url: http://localhost:8083
    description: Local development

tags:
  - name: health
    description: The service's own contracted health route.
  - name: internalCommands
    description: |
      Device commands arriving from orca-runtime (§C3, §B9 step 6).

      Under `/internal/**`, so the per-installation shared credential authenticates
      it and no token is minted (ADR-011).
  - name: internalBuffer
    description: |
      §C3's capture-buffer diagnostics. What an operator asks when a truck went
      through and nothing happened.

      Under `/internal/**`, same credential, same reason (ADR-011).

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: This service's own contracted health route
      description: |
        Returns the shared envelope with a ServiceHealth payload.

        Distinct from `/actuator/health`, which is the orchestrator's probe and
        is not part of this contract.
      responses:
        "200":
          description: The service is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /internal/buffer/stats:
    get:
      tags: [internalBuffer]
      operationId: bufferStats
      summary: Buffer depth, oldest undelivered event and DEAD count, per lane
      description: |
        §C3 names this endpoint and Phase 1 did not build it, so a `DEAD` event —
        one nobody could deliver, which is the single event a site operator most
        needs to see — was visible only to somebody with a database login. That is
        the gap `phase-1-report.md` §3 records as operator blindness.

        **Three numbers per lane, and each answers a different question.**

        * `depth` — `PENDING` + `DISPATCHED`. How far behind this lane is *now*.
        * `oldestUndeliveredAt` / `oldestUndeliveredAgeSeconds` — how far behind it
          has been. A depth of 4 that is nine hours old is a severed link; a depth
          of 400 that is four seconds old is a busy morning. **Depth alone cannot
          tell those apart**, which is why the age is here and not a refinement.
        * `dead` — retired undelivered. Never zero by accident: §D3 retires records
          rather than removing them, so a delivery failure stays distinguishable
          from a capture that never happened.

        **`ownedByThisInstance` is not decoration.** §C3 gives one instance
        ownership of a lane at a time, so an operator reading this from the
        instance that does *not* own a lane is reading a depth nothing here is
        draining. Without this field the same numbers mean two different things
        depending on which address was called, and nothing on the response says
        which.

        Site scope comes from this installation's configuration, never from the
        request — same reason as `/internal/commands/v1`.
      responses:
        "200":
          description: The buffer, as this instance sees it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BufferStatsEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /internal/commands/v1:
    post:
      tags: [internalCommands]
      operationId: issueDeviceCommand
      summary: Issue one command to a lane's device host
      description: |
        **`commandId` is the idempotency key**, and §C3 fixes what it is: the
        node-execution id. Replaying a command returns the recorded outcome rather
        than acting again — a barrier does not rise twice because a caller retried.

        **An expired command is discarded, never delivered.** A command whose
        `deadlineMs` has elapsed before it reached the device host describes a
        world that has moved on: the truck may have gone, another may be in the
        lane. Stale actuation is dangerous in a way that a missed command is not,
        so the deadline is checked here, at the last moment before the physical
        act, and not only by the caller.

        **`UNKNOWN` is part of the enum, not an omission.** It is what the deadline
        produces, and §B10 resolves it by verifying the device's actual state —
        never by retrying and never by assuming failure. A client that coerces it
        to `FAILED` produces the exact hazard the enum exists to prevent: the gate
        told that a barrier did not rise when it did.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCommand"
      responses:
        "200":
          description: The command reached a recorded outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCommandEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The lane is not one this installation's site publishes
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /internal/commands/{commandId}:
    get:
      tags: [internalCommands]
      operationId: readDeviceCommand
      summary: The recorded outcome and device response of a command
      description: |
        §C3's read-back. For a caller that issued a command, lost its answer, and
        must not issue it again to find out what happened.
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: The recorded outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCommandEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No command by that id was ever issued here
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

components:
  schemas:

    DeviceCommand:
      type: object
      required: [commandId, laneExternalId, deviceExternalId, action, deadlineMs]
      properties:
        commandId:
          type: string
          maxLength: 64
          description: The node-execution id (§C3). The idempotency key.
        laneExternalId:
          type: string
          maxLength: 64
        deviceExternalId:
          type: string
          maxLength: 64
          description: |
            Which device on the lane.

            ⚠️ **Required as of H1, and it was optional before.** The reason is the
            real device-host contract: `docs/device-host-outbound-from-1x.md` shows
            the device addressed **in the URL path** —
            `POST /api/{device}/raiseGate` — so a command that does not name a
            device cannot be sent at all. The previous wording ("a lane with one
            barrier does not need to say which barrier") was written against an
            invented contract that carried the device in a JSON body, where it was
            genuinely optional. It is not optional against the fielded estate.
        action:
          type: string
          maxLength: 32
          description: "`RAISE_GATE` · `LOWER_GATE` · `PRINT` · `SET_IO` · `PTZ_PRESET` (§C3)."
        params:
          type: string
          description: Action parameters as a JSON object, passed through to the device host.
        deadlineMs:
          type: integer
          format: int64
          description: |
            How long the command remains worth performing, from when the caller
            issued it. Checked here, at the last moment before the physical act.

    DeviceCommandEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DeviceCommandResult"

    DeviceCommandResult:
      type: object
      properties:
        commandId:
          type: string
        status:
          type: string
          enum: [EXECUTED, FAILED, UNKNOWN, IN_PROGRESS]
          description: |
            §C3's enum, verbatim.

            * `EXECUTED` — the device host acknowledged **and** its response
              decoded. Anything less is not an execution.
            * `FAILED` — the host answered with an error, its response did not
              decode, or the command was discarded as expired before it was sent.
            * `UNKNOWN` — the deadline passed with no answer. Resolved by
              verifying the device, never by retrying.
            * `IN_PROGRESS` — another delivery of this same `commandId` is being
              performed right now. Not terminal, and not a failure.
        deviceResponse:
          type: string
          description: What the device host said, verbatim, for an operator reading the log.
        detail:
          type: string
          description: |
            Why, in one line, when the status alone does not say — notably the
            difference between a host that refused and a command discarded as
            expired. Both are `FAILED`; only one of them reached the hardware.
        ackedAt:
          type: string
          format: date-time

    BufferStatsEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/BufferStats"

    BufferStats:
      type: object
      properties:
        siteExternalId:
          type: string
        observedAt:
          type: string
          format: date-time
          description: |
            This instance's clock, at the moment the numbers were read. The lanes
            are read one at a time and not in one transaction, so this is a
            timestamp for a diagnostic view and not a consistent snapshot — said
            here rather than left to be assumed.
        totalDepth:
          type: integer
          format: int64
          description: Undelivered across every lane at this site.
        totalDead:
          type: integer
          format: int64
          description: |
            Retired undelivered, across every lane. **A non-zero value here is the
            reason this endpoint exists.**
        lanes:
          type: array
          items:
            $ref: "#/components/schemas/LaneBufferStats"

    LaneBufferStats:
      type: object
      properties:
        laneExternalId:
          type: string
        ownedByThisInstance:
          type: boolean
          description: |
            Whether this instance holds the lane's ingest lease (§C3). `false`
            means the numbers below are real and something else is draining them.
        depth:
          type: integer
          format: int64
          description: "`PENDING` + `DISPATCHED` — undelivered right now."
        dead:
          type: integer
          format: int64
        oldestUndeliveredAt:
          type: string
          format: date-time
          description: |
            When the oldest still-undelivered capture arrived. Absent when the
            lane's buffer is empty.
        oldestUndeliveredAgeSeconds:
          type: integer
          format: int64
          description: |
            The same fact as a duration, because that is the one an operator reads.
            Absent when the lane's buffer is empty.

    # The envelope comes from platform/web, which DEFINES and IMPLEMENTS it.
    # A cross-module $ref, resolved by the generator — deliberately not a copy.
    HealthEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ServiceHealth"
