          description: A code from the IO port name catalog (DI1 … DO3 … R2 … FRONT_MIC).
        portAliasName:
          type: string
          maxLength: 200
        reverseState:
          type: boolean
          default: false
        initialHigh:
          type: boolean
          default: false
        dataCapture:
          type: boolean
          default: false
        gosAudio:
          type: boolean
          default: false
        produceTrueMessage:
          type: boolean
          default: true
          description: Edge-suppression semantics — edge reads these; silence is configured, never accidental.
        produceFalseMessage:
          type: boolean
          default: true
        waitTime:
          type: integer
          format: int32

    PerspectiveItem:
      type: object
      required: [name]
      properties:
