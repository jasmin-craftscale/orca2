      description: Another user's filter is indistinguishable from a missing one, deliberately.
      parameters:
        - name: filterExternalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The caller's remaining filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedFiltersEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "403":
          description: The token maps to no active platform user
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such filter owned by the caller
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/sites/{siteExternalId}:
    patch:
      tags: [siteBranding]
      operationId: updateSiteBranding
      summary: Update a site's branding colors and localization languages
      description: |
        The branding-and-localization slice of §C1's site update — Phase 2
        builds no other site CRUD, and says so rather than implying it. Sets
        replace when present.
      parameters:
        - name: siteExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteBrandingRequest"
      responses:
        "200":
          description: The site's branding after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteBrandingEnvelope"
        "400":
          description: A color value is not hex
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: No such site at this installation
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: The latest configuration mutations, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: The audit page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventsEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/entitlements:
    get:
      tags: [entitlements]
      operationId: entitlementCatalog
      summary: The entitlement catalog, as the four-level tree
      description: |
        Codes are the contract; names are display-only (translation rule 7 —
        1.x gated on display strings, and that is exactly what 2.0 does not
        repeat). Licence filtering arrives with the licensing phase; until then
        the whole seeded tree is returned.
      responses:
        "200":
          description: The tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementTreeEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: This service's own contracted health route
      description: |
        Returns the shared envelope with a ServiceHealth payload.

        Distinct from `/actuator/health`, which is the orchestrator's probe and
        is not part of this contract.
      responses:
        "200":
          description: The service is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

components:
  schemas:

    # The envelope comes from platform/web, which DEFINES and IMPLEMENTS it.
    # A cross-module $ref, resolved by the generator — deliberately not a copy.
    HealthEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ServiceHealth"

    # --- WP1 · identity ------------------------------------------------------

    UserSummary:
      type: object
      description: A platform user — profile and claim mapping. No credential ever appears here.
      required: [externalId, displayName, email, roleExternalId, retired]
      properties:
        externalId:
          type: string
          description: Minted by the service on creation, never reused (§B8).
        displayName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        email:
          type: string
        profileImageUrl:
          type: string
        languageCode:
          type: string
        keycloakSubject:
          type: string
          description: The identity-provider subject this user's tokens carry, once linked.
        privacyAcceptedAt:
          type: string
          format: date-time
        termsAcceptedAt:
          type: string
          format: date-time
        roleExternalId:
          type: string
          description: Exactly one role per user.
        retired:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [displayName, email, roleExternalId]
      properties:
        displayName:
          type: string
          maxLength: 200
        firstName:
          type: string
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 320
        profileImageUrl:
          type: string
          maxLength: 512
        languageCode:
          type: string
          maxLength: 32
        keycloakSubject:
          type: string
          maxLength: 64
        roleExternalId:
          type: string

    UpdateUserRequest:
      type: object
      description: Absent fields are unchanged.
      properties:
        displayName:
          type: string
          maxLength: 200
        firstName:
          type: string
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 320
        profileImageUrl:
          type: string
          maxLength: 512
        languageCode:
          type: string
          maxLength: 32
        keycloakSubject:
          type: string
          maxLength: 64
        roleExternalId:
          type: string
        privacyAcceptedAt:
          type: string
          format: date-time
        termsAcceptedAt:
          type: string
          format: date-time
        retired:
          type: boolean

    UserEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/UserSummary"

    UsersEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/UserSummary"

    RoleSummary:
      type: object
      required: [externalId, name, retired, siteExternalIds, entitlementCodes]
      properties:
        externalId:
          type: string
        name:
          type: string
        description:
          type: string
        siteExternalIds:
          type: array
          description: The sites this role is scoped to (role-based site scoping — 1.x user↔site mapping is dead).
          items:
            type: string
        entitlementCodes:
          type: array
          description: The granted catalog leaves, by stable code.
          items:
            type: string
        retired:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 3000
        siteExternalIds:
          type: array
          items:
            type: string
        entitlementCodes:
          type: array
          items:
            type: string

    UpdateRoleRequest:
      type: object
      description: |
        Absent fields are unchanged; `entitlementCodes` and `siteExternalIds`
        REPLACE their sets when present.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 3000
        siteExternalIds:
          type: array
          items:
            type: string
        entitlementCodes:
          type: array
          items:
            type: string
        retired:
          type: boolean

    RoleEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RoleSummary"

    RolesEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/RoleSummary"

    # --- WP2 · teams & templates --------------------------------------------

    HandlingMethod:
      type: string
      description: How work reaches this team's members (§C1). One casing — the database checks it.
      enum: [PUSH, PROMPT]

    LocalTimeString:
      type: string
      description: A wall-clock time of day, HH:mm or HH:mm:ss.
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
      example: "06:00"

    ShiftTemplateSummary:
      type: object
      required: [externalId, name, timeZone, startTime, endTime, overnight, durationMinutes, retired]
      properties:
        externalId:
          type: string
        name:
          type: string
        timeZone:
          type: string
          description: IANA zone id, validated against the JVM's tz database.
        startTime:
          $ref: "#/components/schemas/LocalTimeString"
        endTime:
          $ref: "#/components/schemas/LocalTimeString"
        overnight:
          type: boolean
          description: Computed — end at or before start crosses midnight; equal times are the 24-hour shift.
        durationMinutes:
          type: integer
          format: int32
          description: Computed, never stored — 1.x stored a duration in a TIME column and that defect does not port.
        retired:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateShiftTemplateRequest:
      type: object
      required: [name, timeZone, startTime, endTime]
      properties:
        name:
          type: string
          maxLength: 100
        timeZone:
          type: string
          maxLength: 64
        startTime:
          $ref: "#/components/schemas/LocalTimeString"
        endTime:
          $ref: "#/components/schemas/LocalTimeString"

    UpdateShiftTemplateRequest:
      type: object
      description: Absent fields are unchanged.
      properties:
        name:
          type: string
          maxLength: 100
        timeZone:
          type: string
          maxLength: 64
        startTime:
          $ref: "#/components/schemas/LocalTimeString"
        endTime:
          $ref: "#/components/schemas/LocalTimeString"
        retired:
          type: boolean

    ShiftTemplateEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ShiftTemplateSummary"

    ShiftTemplatesEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/ShiftTemplateSummary"

    BreakTimingItem:
      type: object
      required: [startTime, durationMinutes]
      properties:
        startTime:
          $ref: "#/components/schemas/LocalTimeString"
        durationMinutes:
          type: integer
          format: int32
          minimum: 1

    BreakTemplateSummary:
      type: object
      required: [externalId, name, timings, retired]
      properties:
        externalId:
          type: string
        name:
          type: string
        description:
          type: string
        timings:
          type: array
          items:
            $ref: "#/components/schemas/BreakTimingItem"
        retired:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateBreakTemplateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        timings:
          type: array
          items:
            $ref: "#/components/schemas/BreakTimingItem"

    UpdateBreakTemplateRequest:
