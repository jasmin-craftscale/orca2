          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    put:
      tags: [workspace]
      operationId: replaceMyGridPreferences
      summary: Replace the caller's column preferences for the listed grids
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/GridPreferences"
      responses:
        "200":
          description: The workspace after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceGridsEnvelope"
        "400":
          description: The request repeats a grid or a column
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "403":
          description: The token maps to no active platform user
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: A grid code is not in the catalog
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/me/workspace/filters:
    get:
      tags: [workspace]
