openapi: 3.0.3

# =============================================================================
# orca-core — the authored contract, and the source of truth for its API layer.
#
# The Java API layer is GENERATED from this file (ADR-014). The generator emits
# an interface and its DTOs; the controller is hand-written and implements that
# interface — so changing this document breaks the build until the implementation
# matches. That is what makes contract-first a compile-time constraint rather
# than documentation.
#
# Generated sources are never committed. In version control they drift from the
# spec and nobody notices.
#
# Phase 2 authors the configuration-world surface from §C1's interface table —
# users, roles, entitlements (WP1); the routes still absent arrive with the
# behaviour behind them.
# =============================================================================

info:
  title: orca-core
  description: |
    The world as configured (§C1) — tenancy, sites and lanes, users, devices, design artifacts, custom entities, licence verification.
  version: 0.0.1

servers:
  - url: http://localhost:8081
    description: Local development

tags:
  - name: health
    description: The service's own contracted health route.
  - name: users
    description: User management (§C1). Profile and claim mapping only — credentials are Keycloak's.
  - name: roles
    description: Customer-defined roles, their entitlement grants and site scoping (§C1).
  - name: entitlements
    description: The four-level entitlement catalog (application → module → sub-module → action item).
  - name: teams
    description: Clerk teams — members, handling method (PUSH/PROMPT), shift & break templates (§C1).
  - name: shiftTemplates
    description: The shift template catalog. One validated IANA timezone per template.
  - name: breakTemplates
    description: The break template catalog and its timings.
  - name: devices
    description: The device registry (§C1) — identity, addressing, IO port layout, PTZ presets, plugin-load parameters. Never credentials.
  - name: deviceCatalogs
    description: The seeded device catalogs — types, IO port names, IO device kinds.
  - name: resourceConfigurations
    description: Custom variables at site/area/lane/device scope (§C1).
  - name: settings
    description: "The platform settings registry (§C1): known keys, validated writes, history appended, secrets rejected."
  - name: workspace
    description: The calling user's workspace — grid column preferences and saved filters.
  - name: siteBranding
    description: Per-site branding colors and localization languages.
  - name: audit
    description: The typed audit trail of configuration mutations.

paths:
  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List the installation's users
      description: |
        Retired users are included, flagged, so an administrator can see the
        whole directory; consumers gating on activity read `retired`.
      responses:
        "200":
          description: The directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        The external id is minted by the service and returned. Exactly one role
        per user — `roleExternalId` is required, and the platform will not
        create a user without one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: That identity-provider subject is already linked to an active user
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The named role does not exist
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/users/{userExternalId}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user
      description: |
        Absent fields are unchanged. `retired: true` retires the user
        (§D3 — records are retired, never removed); `retired: false` reinstates.
      parameters:
        - name: userExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The user after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: |
            That identity-provider subject is already linked to an active user —
            on a subject change, or on reinstating a user whose subject was
            meanwhile linked elsewhere
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The named role does not exist
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: List roles, each with its site scope and resolved entitlement grants
      responses:
        "200":
          description: The roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    post:
      tags: [roles]
      operationId: createRole
      summary: Create a role, optionally with grants and site scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: An active role already carries that name
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: An entitlement code or site is unknown
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/roles/{roleExternalId}:
    patch:
      tags: [roles]
      operationId: updateRole
      summary: Update a role, its grants or its site scope
      description: |
        Absent fields are unchanged. `entitlementCodes` and `siteExternalIds`,
        when present, REPLACE the grant set and the site scope respectively —
        they are declarative, not additive. A role still held by an active user
        cannot be retired.
      parameters:
        - name: roleExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: The role after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such role
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: An active role already carries that name, or active users still hold this role
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: An entitlement code or site is unknown
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List the installation's teams, members included
      responses:
        "200":
          description: The teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: An active team at that site already carries that name
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The site, a template or a member user is unknown
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/teams/{teamExternalId}:
    patch:
      tags: [teams]
      operationId: updateTeam
      summary: Update a team, its members or its templates
      description: |
        Absent fields are unchanged. `memberUserExternalIds` REPLACES the
        membership when present. An empty string for a template external id
        clears that template reference.
      parameters:
        - name: teamExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: The team after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such team
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: An active team at that site already carries that name
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: A template or a member user is unknown
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/shift-templates:
    get:
      tags: [shiftTemplates]
      operationId: listShiftTemplates
      summary: The shift template catalog
      responses:
        "200":
          description: The templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTemplatesEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    post:
      tags: [shiftTemplates]
      operationId: createShiftTemplate
      summary: Create a shift template
      description: |
        `overnight` and `durationMinutes` are computed, never accepted: a shift
        whose end is at or before its start crosses midnight, and equal times
        are the 24-hour shift. The timezone must be an IANA zone id the JVM
        knows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftTemplateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTemplateEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: An active template already carries that name
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The timezone is not an IANA zone this platform knows
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/shift-templates/{shiftTemplateExternalId}:
    patch:
      tags: [shiftTemplates]
      operationId: updateShiftTemplate
      summary: Update or retire a shift template
      description: |
        Absent fields are unchanged. A template still referenced by an active
        team cannot be retired.
      parameters:
        - name: shiftTemplateExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftTemplateRequest"
      responses:
        "200":
          description: The template after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTemplateEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such template
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: Name in use, or the template is still referenced by an active team
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The timezone is not an IANA zone this platform knows
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/break-templates:
    get:
      tags: [breakTemplates]
      operationId: listBreakTemplates
      summary: The break template catalog, timings included
      responses:
        "200":
          description: The templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakTemplatesEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    post:
      tags: [breakTemplates]
      operationId: createBreakTemplate
      summary: Create a break template with its timings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBreakTemplateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakTemplateEnvelope"
        "400":
          description: The request repeats a break start time
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: An active template already carries that name
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/break-templates/{breakTemplateExternalId}:
    patch:
      tags: [breakTemplates]
      operationId: updateBreakTemplate
      summary: Update or retire a break template
      description: |
        Absent fields are unchanged; `timings`, when present, REPLACES the
        timing set. A template still referenced by an active team cannot be
        retired.
      parameters:
        - name: breakTemplateExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBreakTemplateRequest"
      responses:
        "200":
          description: The template after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakTemplateEnvelope"
        "400":
          description: The request repeats a break start time
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such template
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: Name in use, or the template is still referenced by an active team
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/lanes/{laneExternalId}/devices:
    get:
      tags: [devices]
      operationId: listLaneDevices
      summary: The device inventory of a lane, port layout and presets included
      parameters:
        - name: laneExternalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such lane
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register a device at a lane
      description: |
        The type is a catalog code — the vocabulary is the seeded catalog, not a
        free string. No credential field exists on this surface: device-credential
        storage is a proposed design awaiting the product owner (WP3 report).
      parameters:
        - name: laneExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterDeviceRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such lane
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The device type code is not in the catalog
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/devices/{deviceExternalId}:
    patch:
      tags: [devices]
      operationId: updateDevice
      summary: Update a device
      parameters:
        - name: deviceExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeviceRequest"
      responses:
        "200":
          description: The device after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such device
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The device type code is not in the catalog
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    delete:
      tags: [devices]
      operationId: retireDevice
      summary: Retire a device
      description: Retirement, not deletion (§D3) — the device leaves every published view and its history stays.
      parameters:
        - name: deviceExternalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The retired device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such device
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/devices/{deviceExternalId}/io-assignments:
    put:
      tags: [devices]
      operationId: replaceIoAssignments
      summary: Replace the device's IO port layout
      description: Declarative — the request's layout is the whole layout.
      parameters:
        - name: deviceExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/IoAssignmentItem"
      responses:
        "200":
          description: The device with its new layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEnvelope"
        "400":
          description: The request repeats a port
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such device
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: A port name code is not in the catalog
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/devices/{deviceExternalId}/perspectives:
    put:
      tags: [devices]
      operationId: replacePerspectives
      summary: Replace the device's named PTZ presets
      description: |
        Preset STORAGE only. Execution is a direct camera call and belongs to
        the hardware boundary (register NEW-5, narrowed 7 Aug 2026).
      parameters:
        - name: deviceExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
