  /api/v1/resource-configurations/{scopeType}/{resourceExternalId}:
    get:
      tags: [resourceConfigurations]
      operationId: readResourceConfiguration
      summary: The custom variables of one scoped resource
      parameters:
        - name: scopeType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceScopeType"
        - name: resourceExternalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The variables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceConfigurationEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such resource at this installation
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    put:
      tags: [resourceConfigurations]
      operationId: replaceResourceConfiguration
      summary: Replace the custom variables of one scoped resource
      description: Declarative — the request's set is the whole set for that resource.
      parameters:
        - name: scopeType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceScopeType"
        - name: resourceExternalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ResourceConfigurationEntry"
      responses:
        "200":
          description: The variables after the change
          content:
