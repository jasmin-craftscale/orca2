                $ref: "#/components/schemas/ResourceConfigurationEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "400":
          description: The request repeats an entry
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such resource at this installation
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: Every known key, its metadata and its current value
      responses:
        "200":
          description: The registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/settings/{settingKey}:
    put:
      tags: [settings]
      operationId: writeSetting
      summary: Write one setting
      description: |
        Validated against the registry — an unknown key is refused, a value
        that fails the key's type is refused, and a SECRET-SHAPED key is
        refused outright with its own code before the registry is even
        consulted (1.x stored SMTP passwords and client secrets in this table;
        2.0 never will). Every accepted write appends to the history.
      parameters:
        - name: settingKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteSettingRequest"
      responses:
        "200":
          description: The setting after the write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingEnvelope"
        "400":
          description: The value fails the key's type
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: Unknown key (SETTING_UNKNOWN), or a secret-shaped key (SETTING_SECRET_REJECTED)
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/me/workspace/grids:
    get:
      tags: [workspace]
