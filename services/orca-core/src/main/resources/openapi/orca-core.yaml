    # --- WP3 · device registry ----------------------------------------------

    DeviceMode:
      type: string
      description: 1.x compared this with LOWER(?) and leaned on collation; here it is one casing.
      enum: [IO, DATA_CAPTURE]

    PortType:
      type: string
      description: The unified port-type enum — TitleCase in one 1.x table, lowercase in another; one casing here.
      enum: [INPUT, OUTPUT, RELAY, AUDIO, TONE]

    ResourceScopeType:
      type: string
      enum: [SITE, AREA, LANE, DEVICE]

    IoAssignmentItem:
      type: object
