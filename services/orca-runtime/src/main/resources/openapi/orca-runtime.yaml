openapi: 3.0.3

# =============================================================================
# orca-runtime — the authored contract, and the source of truth for its API layer.
#
# The Java API layer is GENERATED from this file (ADR-014). The generator emits
# an interface and its DTOs; the controller is hand-written and implements that
# interface — so changing this document breaks the build until the implementation
# matches. That is what makes contract-first a compile-time constraint rather
# than documentation.
#
# Generated sources are never committed. In version control they drift from the
# spec and nobody notices.
#
# A route is authored here when the behaviour behind it exists, and not before —
# publishing a surface nothing implements is how a contract stops being true.
# WP6 adds the second one: /internal/events/v1.
# =============================================================================

info:
  title: orca-runtime
  description: |
    The gate brain (§C2) — the process engine, visits, work items, connectors, the partner event API, notifications, operator grids, lane commands.
  version: 0.0.1

servers:
  - url: http://localhost:8082
    description: Local development

tags:
  - name: health
    description: The service's own contracted health route.
  - name: internalEvents
    description: |
      Device events arriving from orca-edge (§C2, §B9).

      Under `/internal/**`, so the per-installation shared credential authenticates
      it and no token is minted (ADR-011). The identity provider authenticates
      people; putting it on the gate path would make a truck's admission depend on
      it being reachable.
  - name: workItems
    description: |
      The clerk workflow (§C2, §B9) — human work a process could not finish.

      Every state transition is a conditional UPDATE guarded by rows-affected;
      a caller who loses a race receives a typed 409 carrying the item's current
      state, never a silent no-op. Completing an item advances the parked
      process in the same transaction, and a submit for a step the engine is not
      waiting on is refused.
  - name: lanes
    description: |
      Lane operations. Reset aborts the running visit, fails its open work
      items and terminates its process instance — one transaction (§C2).
  - name: visits
    description: |
      Reading what happened to a truck (§C2).

      The direct read of `execution`'s own rows — deliberately NOT a grid
      projection. A grid is pre-built by `readmodel` so it never fans out across
      modules; this is the owning module answering about its own table, which is
      why it can carry the engine's live position and a projection cannot.
  - name: presence
    description: |
      Operator presence (§C2). The open activity row is the current status —
      there is no status column on any user. IDLE and WORKING are assignable;
      the Push routing path selects from them.
  - name: designer
    description: |
      What the builder calls while somebody is editing a workflow.

      The compiler is the definition of valid, and these routes are the only way
      to ask it — the alternative, reimplementing the invariants in the frontend,
      drifts within a release, and a drifted validator blesses a workflow the
      deploy then rejects. Nothing is stored and nothing is deployed: a draft is
      compiled in memory and thrown away, which makes these safe to call on every
      debounce.

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: This service's own contracted health route
      description: |
        Returns the shared envelope with a ServiceHealth payload.

        Distinct from `/actuator/health`, which is the orchestrator's probe and
        is not part of this contract.
      responses:
        "200":
          description: The service is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /internal/events/v1:
    post:
      tags: [internalEvents]
      operationId: acceptDeviceEvents
      summary: Accept a batch of device events from the site's edge instance
      description: |
        One batch, one lane's worth of events, oldest first (§D3: ordered per key,
        never globally).

        **At least once, and that is deliberate.** Edge resends a batch it never
        saw acknowledged, so the same `eventUuid` may arrive twice — §B4 mechanism
        4 takes that trade knowingly, because a lost event is unrecoverable and a
        repeated one is not. Every event is claimed through the idempotency store
        before it is admitted, so a redelivered batch has one effect and the second
        delivery is told what the first produced rather than being refused.

        The response is per event: an outcome for each, in the order sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceEventBatch"
      responses:
        "200":
          description: Every event in the batch reached a recorded outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceEventBatchEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: |
            An event names a lane this installation does not have.

            The batch is refused whole, so edge keeps it buffered and in order.
            §C2 says an unmatched event is made visible rather than dropped; the
            operator surface that shows one is Phase 2, so until then the event
            stays in edge's buffer, is retried, and becomes `DEAD` there — which
            is visible through the buffer's own diagnostics.
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/visits:
    get:
      tags: [visits]
      operationId: listVisits
      summary: Search visits by lane, status and time window
      description: |
        **A bounded read of a traffic-growing table.** `execution` grows with every
        truck, so this never serves the whole table: `limit` is capped and a window
        that is not given defaults to recent activity rather than to all of history.
        Ordered newest first — the operational question is almost always about the
        last few minutes.

        Scope is the installation's own site, taken from configuration and never
        from the request.
      parameters:
        - name: laneExternalId
          in: query
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, MANUAL, FAILED]
        - name: plate
          in: query
          description: Exact match. The plate as the camera's most confident hypothesis recorded it.
          schema:
            type: string
            maxLength: 32
        - name: since
          in: query
          description: |
            Visits started at or after this instant. Absent means the last 24 hours —
            **a default window rather than no window**, because an unpredicated read
            of a traffic-growing table is how a support query becomes a table scan.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The matching visits, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitListEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: |
            `status` is not one this platform has.

            Refused rather than ignored. A mistyped status that filtered nothing
            would answer `200` with an empty list — which reads as "no visits at
            this gate" and is the same silent-narrowing mistake the work-item
            team filter refuses.
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/visits/{visitExternalId}:
    get:
      tags: [visits]
      operationId: getVisit
      summary: One visit, with the step it is currently parked at
      description: |
        The stored row **plus the engine's live position** for a running visit —
        which is the reason this route exists on the owning module rather than on a
        projection. `currentActivity` is read from the engine at request time and is
        absent once the visit is no longer running.
      parameters:
        - name: visitExternalId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: The visit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such visit under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/visits/{visitExternalId}/abort:
    post:
      tags: [visits]
      operationId: abortVisit
      summary: Abort this visit — terminate its process, fail its work items, free its lane
      description: |
        One transaction, and the same one lane reset performs: the process instance
        is terminated, the visit's open work items are failed, and the lane is
        released for the next truck.

        Addressed by visit rather than by lane, and the visit's identity is
        re-checked under the lane lock — so a visit that finished while the request
        was in flight is refused rather than having the next truck aborted in its
        place.

        Aborting a visit that is no longer running answers `409`. Unlike resetting an
        already-clear lane, which is an ordinary outcome, naming a specific visit and
        being wrong about its state is a mistake worth reporting.
      parameters:
        - name: visitExternalId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: What was aborted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaneResetEnvelope"
        "401":
          description: No credential, or no resolvable operator behind it
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such visit under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: The visit is no longer running
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/lanes/{laneExternalId}/visit:
    get:
      tags: [visits]
      operationId: getLaneVisit
      summary: The visit running on this lane right now, if any
      description: |
        The lane's current visit, with the step the engine is parked at.

        **An empty lane answers `200` with a null `data`, not `404`.** A lane with
        no truck at it is the normal state of a gate, and reporting it as "not
        found" would make an ordinary condition indistinguishable from a
        misconfigured lane identifier.

        A lane this installation does not publish answers `422` — that IS a
        configuration fault and must not read as "no truck here".
      parameters:
        - name: laneExternalId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: The running visit, or null when the lane is clear
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The lane is not published for this installation
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/lanes/{laneExternalId}/take-next:
    post:
      tags: [workItems]
      operationId: takeNextOnLane
      summary: Claim the oldest queued item on this lane's running visit
      description: |
        Take-by-lane, for an operator working a lane monitor rather than the queue.

        A convenience over `POST /work-items/{id}/take` and nothing more: the same
        eligibility check, the same conditional UPDATE as the only race guard, the
        same typed `409` for the loser, the same `TAKE` audit row.

        **Oldest queued first, not the queue grid's priority order.** The grid ranks
        work across lanes; this answers "the next thing at this lane", where one
        visit's items are a sequence.
      parameters:
        - name: laneExternalId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: The item, now held by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemEnvelope"
        "401":
          description: No credential, or no resolvable operator behind it
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "403":
          description: The operator is outside the item's eligible teams
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: Nothing is running on this lane, or it has no queued item
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: Somebody else claimed it first
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: The lane is not published for this installation
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/work-items:
    get:
      tags: [workItems]
      operationId: listWorkItems
      summary: The queue, filtered
      description: |
        Queue membership is `status` + `queuedAt` + assignee — there is no queue
        table. **No `status` means the open queue** (QUEUED and IN_PROGRESS) —
        the table grows with traffic, and an unpredicated read would serve
        history, not work. Open-queue reads are ordered by the routing rules'
        priority — set before unset, lower more urgent, oldest-queued as the
        tiebreak; terminal-status reads are oldest first.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [QUEUED, IN_PROGRESS, COMPLETED, FAILED]
        - name: laneExternalId
          in: query
          schema:
            type: string
        - name: assignee
          in: query
          schema:
            type: string
        - name: teamExternalId
          in: query
          description: |
            Narrow to a team's routed work — plus the unrouted items, which
            every grid shows because anyone may claim them. Ordering uses this
            team's rule priorities. **Open-queue reads only**: on a
            terminal-status read the parameter is refused (422), because
            silently ignoring it would present every team's history as one
            team's.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The matching items, oldest queued first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemListEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "422":
          description: teamExternalId was combined with a terminal status
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/work-items/{workItemExternalId}:
    get:
      tags: [workItems]
      operationId: getWorkItem
      summary: One item, with its captured and corrected data
      parameters:
        - $ref: "#/components/parameters/WorkItemExternalId"
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemEnvelope"
        "404":
          description: No such item under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/work-items/{workItemExternalId}/take:
    post:
      tags: [workItems]
      operationId: takeWorkItem
      summary: Claim the item — a guarded conditional update
      description: |
        `QUEUED` → `IN_PROGRESS`, exactly one winner. The loser receives a
        typed 409 carrying the item's current state and holder — the conditional
        UPDATE is the only guard; there is no pre-check that can race.
        A pre-assigned item is claimable by its assignee only.
      parameters:
        - $ref: "#/components/parameters/WorkItemExternalId"
      responses:
        "200":
          description: This caller won the claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemEnvelope"
        "403":
          description: The operator is outside the item's eligible teams (WORK_ITEM_NOT_ELIGIBLE)
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "404":
          description: No such item under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: Somebody else acted first. The error detail carries the current state
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/work-items/{workItemExternalId}/takeover:
    post:
      tags: [workItems]
      operationId: takeoverWorkItem
      summary: Supervisor takeover — reassigns and resets the clock, stays IN_PROGRESS
      parameters:
        - $ref: "#/components/parameters/WorkItemExternalId"
      responses:
        "200":
          description: The item, now held by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemEnvelope"
        "404":
          description: No such item under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: The item is not in progress, or its holder changed mid-flight
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/work-items/{workItemExternalId}/park:
    post:
      tags: [workItems]
      operationId: parkWorkItem
      summary: Return an in-progress item to the queue
      description: |
        Park is re-queue — `IN_PROGRESS` → `QUEUED`, assignee and clock cleared.
        There is no distinct PARKED status; the design choice is stated in the
        phase report rather than inherited silently.
      parameters:
        - $ref: "#/components/parameters/WorkItemExternalId"
      responses:
        "200":
          description: The item, queued again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemEnvelope"
        "404":
          description: No such item under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: The caller does not hold the item
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/work-items/{workItemExternalId}/assign:
    post:
      tags: [workItems]
      operationId: assignWorkItem
      summary: Pre-assign to a chosen operator; the item stays QUEUED
      parameters:
        - $ref: "#/components/parameters/WorkItemExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignWorkItemRequest"
      responses:
        "200":
          description: The item, assigned and still queued — the assignee must take it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemEnvelope"
        "404":
          description: No such item under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: The item is no longer queued
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/work-items/{workItemExternalId}/complete:
    post:
      tags: [workItems]
      operationId: completeWorkItem
      summary: Complete the item AND advance the parked process — one transaction
      description: |
        The inversion this phase exists for: the item's completion and the
        engine's advance commit together or not at all. There is no state where
        the console believes an item is done and the engine does not.

        `completionDurationSec` is computed by the server from the item's own
        clock — the request cannot supply it.

        A submit for a step the engine is not waiting on — already completed,
        reset, or never this item's step — is refused with a typed 409, and
        nothing moves.
      parameters:
        - $ref: "#/components/parameters/WorkItemExternalId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteWorkItemRequest"
      responses:
        "200":
          description: Completed, and the process advanced in the same transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemEnvelope"
        "404":
          description: No such item under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "409":
          description: |
            Refused whole. Either the caller does not hold the item, or the
            engine is not waiting on this step (the out-of-order submit). The
            error code distinguishes the two.
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/work-items/{workItemExternalId}/audit:
    get:
      tags: [workItems]
      operationId: getWorkItemAudit
      summary: The action trail for an item
      parameters:
        - $ref: "#/components/parameters/WorkItemExternalId"
      responses:
        "200":
          description: Every action on the item, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemAuditEnvelope"
        "404":
          description: No such item under this installation's scope
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/me/presence:
    get:
      tags: [presence]
      operationId: getMyPresence
      summary: The calling operator's current status
      responses:
        "200":
          description: The current status — OFFLINE when no transition was ever recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceEnvelope"
        "401":
          description: No credential, or no resolvable operator behind it
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
    put:
      tags: [presence]
      operationId: setMyPresence
      summary: Move to a new status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPresenceRequest"
      responses:
        "200":
          description: The new open activity row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceEnvelope"
        "401":
          description: No credential, or no resolvable operator behind it
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/operators/idle:
    get:
      tags: [presence]
      operationId: listAssignableOperators
      summary: Operators assignable right now — IDLE or WORKING, longest in state first
      responses:
        "200":
          description: The assignable operators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceListEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/operators/activity:
    get:
      tags: [presence]
      operationId: listOperatorActivity
      summary: Presence history for one operator, newest first
      parameters:
        - name: userExternalId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 50
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The transitions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceListEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/lanes/{laneExternalId}/reset:
    post:
      tags: [lanes]
      operationId: resetLane
      summary: Reset the lane in one transaction
      description: |
        §C2: abort the running visit, terminate its process instance and fail
        its open work items — together. This is the writer that makes the
        work item's FAILED status real. Resetting an already-clear lane is an
        ordinary outcome, not an error.
      parameters:
        - name: laneExternalId
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "401":
          description: No credential, or no resolvable operator behind it
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "200":
          description: What was reset — nothing, when the lane was already clear
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaneResetEnvelope"
        "422":
          description: The lane is not published for this installation
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/designer/validate:
    post:
      tags: [designer]
      operationId: validateDraft
      summary: Validate a draft workflow by really compiling it
      description: |
        The verdict — `compiles` — comes from actually compiling the draft, so
        validation and deployment cannot disagree about whether a workflow is
        publishable. The findings list every problem at once, addressed to the
        person editing, each carrying the SAME invariant name the deploy failure
        would carry.

        The body is the draft publish payload exactly as the designer would send
        it to publish — the same bytes, so what is validated is what would deploy.
        A payload that cannot even be read is still an answer the builder can
        draw: not publishable, and here is why — never an internal detail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignerDraft"
      responses:
        "200":
          description: The verdict, with every finding at once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReportEnvelope"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

  /api/v1/designer/namespace:
    post:
      tags: [designer]
      operationId: draftNamespace
      summary: What a selector may name at a point in a draft
      description: |
        The data behind the builder's autocomplete. A selector typed by hand that
        names something no upstream step produces resolves to empty, the condition
        compares against empty, and a truck takes the wrong branch with nothing
        logged — offering the right thing first is how that class dies at the
        keyboard rather than at 3am.

        It helps, it does not police: every step in the draft comes back, each
        marked with whether it runs before the editing point — ranking, not
        filtering. POST because a draft is not saved anywhere; the payload being
        edited is the input, exactly as `/validate` takes it.
      parameters:
        - name: nodeUuid
          in: query
          required: false
          description: |
            The step being edited. Given one, steps are marked with whether they
            run before it; without one there is no editing point to be upstream
            of, and the ranking is simply flat.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignerDraft"
      responses:
        "200":
          description: The namespace, ranked for the editing point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectorNamespaceEnvelope"
        "400":
          description: The draft could not be read as a publish payload
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        "401":
          description: No credential, or one that did not verify
          content:
            application/json:
              schema:
                $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"

components:
  parameters:
    WorkItemExternalId:
      name: workItemExternalId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64

  schemas:

    WorkItem:
      type: object
      properties:
        externalId:
          type: string
        visitExternalId:
          type: string
          description: The visit this item belongs to.
        laneExternalId:
          type: string
        processDefinitionKey:
          type: string
        nodeReference:
          type: string
          description: The step in the process design — the screen identity's node reference points at this.
        screenExternalId:
          type: string
          description: The screen identity this item renders with. Absent until the routing work package resolves it.
        status:
          type: string
          enum: [QUEUED, IN_PROGRESS, COMPLETED, FAILED]
        assignee:
          type: string
          description: The holding or pre-assigned operator's external id; absent = unassigned.
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        completionDurationSec:
          type: integer
          format: int32
          description: Server-computed. The request can never supply it.
        slaBreachedAt:
          type: string
          format: date-time
          description: When the SLA timer on the wait state fired. Absent = not breached.
        eventData:
          type: string
          description: The captured context of the step, as JSON.
        correctedEventData:
          type: string
          description: What the operator submitted at completion.

    Visit:
      type: object
      properties:
        externalId:
          type: string
        laneExternalId:
          type: string
        status:
          type: string
          enum: [ACTIVE, COMPLETED, MANUAL, FAILED]
          description: |
            * `ACTIVE` — running, or parked at a step waiting for a person.
            * `COMPLETED` — the truck was released.
            * `MANUAL` — the process ended at a step a person resolved.
            * `FAILED` — the lane was reset under it.
        plate:
          type: string
          description: The camera's most confident hypothesis, not its first. Absent when the event carried none.
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        currentActivity:
          type: string
          description: |
            The step the engine is parked at, read live at request time. Absent when
            the visit is no longer running — a finished visit has no current step,
            and reporting its last one as current would be a lie a support engineer
            would act on.

    VisitEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Visit"

    VisitListEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Visit"

    WorkItemAuditEntry:
      type: object
      properties:
        action:
          type: string
          enum: [TAKE, TAKE_OVER, PARK, ASSIGN, COMPLETE, FAIL, SLA_BREACH]
        actor:
          type: string
        previousAssignee:
          type: string
        occurredAt:
          type: string
          format: date-time
        processingDurationSec:
          type: integer
          format: int32
        elapsedSec:
          type: integer
          format: int32

    AssignWorkItemRequest:
      type: object
      required: [assigneeExternalId]
      properties:
        assigneeExternalId:
          type: string
          maxLength: 64

    CompleteWorkItemRequest:
      type: object
      properties:
        correctedEventData:
          type: string
          description: The operator's corrected data, stored verbatim on the item.

    PresenceStatus:
      type: string
      enum: [IDLE, WORKING, DND, BREAK, OFFLINE, ACTIVE]

    PresenceActivity:
      type: object
      properties:
        userExternalId:
          type: string
        status:
          $ref: "#/components/schemas/PresenceStatus"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          description: Absent on the open row — the current status.

    SetPresenceRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/PresenceStatus"

    PresenceEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PresenceActivity"

    PresenceListEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/PresenceActivity"

    LaneResetResult:
      type: object
      properties:
        laneExternalId:
          type: string
        visitExternalId:
          type: string
          description: The visit that was aborted. Absent when the lane was already clear.
        failedWorkItems:
          type: integer
          format: int32

    WorkItemEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WorkItem"

    WorkItemListEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WorkItem"

    WorkItemAuditEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WorkItemAuditEntry"

    LaneResetEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/LaneResetResult"

    DeviceEventBatch:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DeviceEvent"

    DeviceEvent:
      type: object
      required: [eventUuid, laneExternalId, eventType]
      properties:
        eventUuid:
          type: string
          maxLength: 64
          description: |
            The producer's dedup key — the camera's own `EventGuid` for a plate
            read. The idempotency key, and the reason a redelivery has one effect.
        laneExternalId:
          type: string
          maxLength: 64
          description: The lane, in core's published vocabulary (`core.topology_lane`).
        deviceExternalId:
          type: string
          maxLength: 64
        eventType:
          type: string
          maxLength: 32
          description: "`lpr.capture`, … ⚠️ PROVISIONAL: nothing in the architecture enumerates these."
        occurredAt:
          type: string
          format: date-time
          description: When the device observed it. The device's clock, not this service's.
        attributes:
          type: string
          description: |
            The normalised half of the event, as a JSON object.

            Edge is the hardware boundary (§C3), so the vendor's dialect stops
            there: this carries `plate`, `confidence` and so on, and never a
            `ZapPacket`. A string rather than a free-form object because it is
            stored verbatim and this contract takes no position on its keys.

    DeviceEventBatchEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DeviceEventBatchResult"

    DeviceEventBatchResult:
      type: object
      properties:
        accepted:
          type: integer
          format: int32
          description: Events this delivery admitted — started or correlated.
        duplicates:
          type: integer
          format: int32
          description: Events a previous delivery had already admitted.
        results:
          type: array
          items:
            $ref: "#/components/schemas/DeviceEventResult"

    DeviceEventResult:
      type: object
      properties:
        eventUuid:
          type: string
        status:
          type: string
          enum: [STARTED, CORRELATED, DUPLICATE, IN_PROGRESS]
          description: |
            * `STARTED` — this event began the visit. Exactly one of two
              simultaneous events for a lane gets it.
            * `CORRELATED` — a visit was already running on the lane and this
              event joined it. Also a success: the two are not "ok" and "not ok".
            * `DUPLICATE` — a previous delivery already admitted this
              `eventUuid`, and `visitExternalId` is what it produced. Not an
              error: the caller retried because it never saw the first answer,
              so an error is the one response it cannot use.
            * `IN_PROGRESS` — another delivery of this same event is in flight
              and will complete. Not terminal and not a failure.
        visitExternalId:
          type: string
          description: The visit this event belongs to, whichever way it got there.

    # The envelope comes from platform/web, which DEFINES and IMPLEMENTS it.
    # A cross-module $ref, resolved by the generator — deliberately not a copy.
    HealthEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ServiceHealth"

    DesignerDraft:
      type: object
      description: |
        A draft publish payload, passed through to the compiler as-is. Free-form
        on purpose: the payload's shape belongs to the compiler, which refuses a
        malformed one by name — a schema here would be a second, drifting copy of
        that judgement.
      additionalProperties: true

    ValidationFinding:
      type: object
      properties:
        invariant:
          type: string
          description: |
            The compiler invariant that would refuse this — the SAME name the
            compile failure carries, so a builder message and a deploy failure
            are traceably one thing.
        subjectId:
          type: string
          description: The node, link, branch or response uuid the author should look at. Absent when the finding is about the workflow as a whole.
        subjectName:
          type: string
          description: The authored name of that subject, because a uuid means nothing on a canvas.
        message:
          type: string
          description: Plain language, addressed to an author rather than to a compiler engineer.

    ValidationReport:
      type: object
      properties:
        compiles:
          type: boolean
          description: Would this deploy — answered by really compiling, so the verdict and the deploy cannot disagree.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFinding"

    ValidationReportEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ValidationReport"

    NamespaceNode:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        type:
          type: string
        selector:
          type: string
          description: The selector text an author would write to name this step's data.
        runsBefore:
          type: boolean
          description: |
            This step's data already exists at the editing point — a ranking
            hint for the builder, never a restriction.

    NamespaceDatasetKey:
      type: object
      properties:
        key:
          type: string
        selector:
          type: string
        provenance:
          type: string
          description: |
            `AUTHORED` — some condition in this draft already reads it, so it is
            part of the vocabulary by construction. `OBSERVED` — visits of this
            workflow have actually written it, the stronger evidence. A key may
            be both.

    NamespaceWorkflow:
      type: object
      properties:
        workflowUuid:
          type: string
        workflowId:
          type: integer
          format: int64
        name:
          type: string
        selector:
          type: string

    SelectorNamespace:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NamespaceNode"
        datasetKeys:
          type: array
          items:
            $ref: "#/components/schemas/NamespaceDatasetKey"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/NamespaceWorkflow"
        helpers:
          type: array
          items:
            type: string
          description: The evaluator's helper functions, as an author writes them.

    SelectorNamespaceEnvelope:
      allOf:
        - $ref: "../../../../../../platform/web/src/main/resources/openapi/_shared.yaml#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SelectorNamespace"
