# orca-runtime — the gate brain
#
# Six bootable applications run on one developer machine, so each takes its own
# port and its own database login. Neither problem is visible until someone tries
# to run them all at once, which is why this file exists before there is anything
# to run.

server:
  port: 8082

spring:
  application:
    name: orca-runtime

  # --- Datasource -----------------------------------------------------------
  # The username is THIS SERVICE'S OWN LOGIN. Schema ownership
  # is enforced by credentials, not by convention. A service pointed at a shared
  # administrative login has no enforcement at all, and no build check can see it.
  datasource:
    url: ${ORCA_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=orca;encrypt=true;trustServerCertificate=true}
    username: ${ORCA_RUNTIME_DB_USERNAME:orca_runtime}
    password: ${ORCA_RUNTIME_DB_PASSWORD:Orca!Runtime2026}
    hikari:
      pool-name: orca-runtime
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Migrations own the schema. Hibernate never does, in any profile: a schema
      # generated from entities is a schema with no history and no review.
      ddl-auto: none
    properties:
      hibernate:
        default_schema: runtime

  # --- Flyway ---------------------------------------------------------------
  # This service migrates ITS OWN SCHEMA ONLY, on its own startup, with its own
  # credentials. No service can migrate another's, for the same reason no service
  # can write another's tables.
  flyway:
    enabled: true
    schemas: runtime
    default-schema: runtime
    # The bootstrap creates the schemas. A service login cannot — creating a
    # schema is a privileged operation, and `orca_runtime` is not privileged.
    create-schemas: false
    locations:
      # This service's own migrations, in this service's own module.
      - classpath:db/migration
      # The primitives' tables, defined once by the primitive that implements
      # them and applied into THIS schema by THIS service's Flyway. One
      # definition, six schemas — not a shared migrations module, which would
      # centralise schema definition away from the services that own it.
      - classpath:db/platform/outbox
      - classpath:db/platform/lease
      - classpath:db/platform/idempotency
    # An expand-only discipline across an upgrade pair means a migration is
    # never edited after it ships. Checksum drift is a mistake, not a workflow.
    validate-on-migrate: true

  # --- Identity -------------------------------------------------------------
  # Tokens are validated BY SIGNATURE, LOCALLY, against the realm's published
  # keys. Nothing calls out to Keycloak per request, which is also what
  # lets a site keep working when the wide-area link drops.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ORCA_OIDC_ISSUER_URI:http://localhost:8080/realms/orca}

# --- Actuator ---------------------------------------------------------------
# Health, and nothing this service does not need. `/actuator/health` is the
# orchestrator's probe.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# --- Flowable ---------------------------------------------------------------
# The engine is embedded and its tables live in the `runtime` schema. It is
# reached behind an interface so the platform is not written against a specific
# engine's API throughout.
#
# The engine does not migrate itself. An earlier configuration left this at
# Flowable's default of `true`, even though engine tables belong in the runtime
# schema and schema changes must be
# compatible with both versions for the duration of a rolling upgrade. Those two
# cannot both hold while the engine reshapes its own tables on whichever instance
# happens to start first.
#
# So the DDL is versioned migrations like everything else — V110 to V114,
# EXTRACTED from the Flowable jars on the runtime classpath rather than
# hand-written or downloaded, by `./gradlew :services:orca-runtime:extractFlowableSchema`.
#
# `false` means the engine creates nothing and validates nothing beyond its own
# recorded schema version. A mismatch surfaces as an engine startup error, which
# is the loud failure worth having: the alternative is an engine quietly adding a
# column that no migration records and that the other instance in a rolling
# upgrade does not have.
#
# ⚠️ An installation that already ran with `true` has the tables but no Flyway
# history for them, so V110 fails on "table already exists". Nothing is deployed
# yet, so this affects developer machines only — drop the ACT_*/FLW_* tables, or
# the schema, and let Flyway build them. See docs/phase-1-report.md.
flowable:
  database-schema-update: false

orca:
  service: orca-runtime
  # --- Service-to-service authentication --------------------------------------
  # Keycloak authenticates PEOPLE. A service calling another service presents this
  # per-installation shared credential on /internal/** instead of minting a token,
  # so no identity provider sits on the gate path. The committed value is the
  # local fixture: outside the `local` profile a service REFUSES TO START with it,
  # so it cannot ship to a site by inertia.
  internal:
    shared-credential: ${ORCA_INTERNAL_CREDENTIAL:local-dev-internal-credential-not-for-deployment}

  # ⚠️ LOCAL DEVELOPMENT VALUES. There is deliberately no universal lease
  # duration or renewal interval. LeaseConfigurationValidator requires the service
  # to REFUSE TO START when either is
  # unset or when the duration is not longer than the renewal interval — see
  # LeaseConfigurationValidator, which is that specification. These two numbers are
  # therefore a local profile's answer and NOT a recommendation for a site: a
  # deployment must choose its own against its own network and restart behaviour.
  lease:
    duration: 30s
    renewal-interval: 10s

  # ⚠️ STILL EMPTY. Nothing in the current on-site scope consumes
  # `visit.completed`; a future cloud tier may do so, so the relay runs and has
  # nothing to deliver. This is
  # deliberately not defaulted to something: the registry decides whose
  # acknowledgement retention waits for, and a guess in the permissive direction
  # deletes data a peer never received.
  #
  # The FACT is still recorded, in the visit's own transaction, which is the
  # guarantee that matters. Delivery arrives with a destination.
  outbox:
    consumers: []
    relay:
      interval: ${ORCA_OUTBOX_RELAY_INTERVAL:1s}
      batch-size: ${ORCA_OUTBOX_RELAY_BATCH_SIZE:50}

  # See RequiredViewsGate: fully-qualified views this service requires before it
  # will serve. These are orca-core's two published views used on the gate path.
  #
  # This is the deployment ordering, expressed where a person can act on it: core
  # migrates first, because it publishes the views the gate path reads.
  # Start this service first and it refuses, naming both — rather than starting
  # and failing on its first lane lookup, which is far harder to diagnose.
  required-views: ${ORCA_REQUIRED_VIEWS:core.topology_lane,core.topology_device}

  # --- Which installation this is ---------------------------------------------
  # The site this installation serves, in core's published vocabulary. It is the
  # SCOPE the /internal/events/v1 path establishes before it reads or writes
  # anything, and it is CONFIGURATION rather than something the request carries.
  #
  # A site identifier on the wire would be a value the caller chooses, and the
  # credential on /internal/** is a per-installation shared secret that
  # cannot prove WHICH peer is calling — so trusting it to name a site would be
  # reading far more into it than it can carry. Exactly one site is primary,
  # and it is the one the licence binds to.
  installation:
    site-external-id: ${ORCA_SITE_EXTERNAL_ID:SITE-DEMO}

  runtime:
    # This instance's identity in `idempotency_record`. An operator reading that
    # table needs to know WHICH MACHINE is mid-way through an event, so it defaults
    # to the hostname rather than to a uuid.
    holder-id: ${ORCA_RUNTIME_HOLDER_ID:${HOSTNAME:runtime-local}}

    # Where the site's edge instance accepts device commands:
    # /internal/commands/v1. There is one address because a lane's hardware is owned by one
    # edge instance at a time and that instance is reached through the site's own
    # load balancer or its single host — which of those is a deployment's choice.
    edge-base-url: ${ORCA_EDGE_BASE_URL:http://localhost:8083}

    # --- Connector resilience -------------------------------------------------
    # ⚠️ LOCAL VALUES. There is deliberately no universal threshold or window:
    # a customer system that is routinely slow at shift change and
    # one that never is want different numbers. What is NOT tunable is the shape —
    # COUNT_BASED rather than time-based, because a gate that sees six trucks an
    # hour would never fill a time window, and a breaker with no data never opens.
    connector:
      breaker:
        window: ${ORCA_CONNECTOR_BREAKER_WINDOW:20}
        failure-rate-percent: ${ORCA_CONNECTOR_BREAKER_FAILURE_RATE:50}
        open-duration: ${ORCA_CONNECTOR_BREAKER_OPEN_DURATION:30s}
        half-open-calls: ${ORCA_CONNECTOR_BREAKER_HALF_OPEN_CALLS:3}
      bulkhead:
        # How many calls one connector may have in flight. Refused immediately
        # rather than queued: queueing here would reintroduce the pile-up the
        # bulkhead exists to prevent, one level up.
        max-concurrent-calls: ${ORCA_CONNECTOR_BULKHEAD_MAX:16}

    # ⚠️ SLICE SHAPE, NOT TARGET SHAPE. In the product these come from the process
    # definition itself — the visual builder's compiler emits a connector step
    # naming its connector and a device step naming its action; process definitions are assigned
    # definitions to lanes. There is one process and one lane here, so carrying
    # them as configuration keeps admission from inventing a definition-to-lane
    # binding that the product configuration model must eventually provide.
    gate-visit:
      connector-name: ${ORCA_GATE_VISIT_CONNECTOR:tos}
      command-action: ${ORCA_GATE_VISIT_ACTION:RAISE_GATE}
      # Which device the action goes to. NOT optional, and not decoration: the
      # device-host contract addresses the device in the URL path
      # (`POST /api/{device}/raiseGate`, translated from the legacy 1.x caller), so a command that names
      # no device cannot be sent. Same slice-shaped caveat as the two above.
      command-device: ${ORCA_GATE_VISIT_DEVICE:DEV-DEMO-BARRIER}
      # Every external call has a deadline and a defined outcome when it is
      # exceeded. This one's defined outcome is UNKNOWN, which routes to
      # verify-the-device rather than to a blind retry.
      command-deadline-ms: ${ORCA_GATE_VISIT_DEADLINE_MS:5000}

---
# --- The `local` profile ------------------------------------------------------
# Activate with --spring.profiles.active=local. Nothing here is for a deployment.
spring:
  config:
    activate:
      on-profile: local

orca:
  secrets:
    current-key-id: local-dev-v1
    keys:
      local-dev-v1: b3JjYS1sb2NhbC1zZWNyZXQta2V5LWZpeHR1cmUtMzI=

  web:
    # Makes the contract and Swagger UI readable without a token, so a developer
    # with docker compose running can open them. Off everywhere else: whether an
    # installation publishes its API surface is a security decision with a named
    # owner, not a convenience setting.
    public-docs: true
